<ion-header>
	<app-header title="Register"></app-header>
</ion-header>

<ion-content>
	<div style="max-width: 500px; margin: 0 auto">
		<ion-card>
			<ion-card-header>
				<ion-card-title class="ion-text-center"
					>Register is only needed for employees of the library</ion-card-title
				>
			</ion-card-header>

			<ion-card-content>
				<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
					<ion-item>
						<ion-input
							label="Email"
							labelPlacement="floating"
							formControlName="email"
							type="email"
						></ion-input>
					</ion-item>

					<ion-item>
						<ion-input
							label="Username"
							labelPlacement="floating"
							formControlName="username"
							type="text"
						></ion-input>
					</ion-item>

					<ion-item>
						<ion-input
							label="Password"
							labelPlacement="floating"
							formControlName="password"
							type="password"
						></ion-input>
					</ion-item>

					<ion-text color="danger" [hidden]="!errorMessage()">{{ errorMessage() }}</ion-text>

					<ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="isSubmitting()"
						>Register</ion-button
					>

					<div class="register-link ion-text-center ion-margin-top">
						<ion-button fill="clear" size="small" (click)="goToLogin()" [disabled]="isSubmitting()">
							Already have an account? Login
						</ion-button>
					</div>
				</form>
			</ion-card-content>
		</ion-card>
	</div>
</ion-content>
