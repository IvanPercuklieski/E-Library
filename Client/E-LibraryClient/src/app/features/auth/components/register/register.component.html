<ion-header>
	<app-header title="Register"></app-header>
</ion-header>

<ion-content class="auth-page">
	<div class="auth-shell ion-padding">
		<ion-card>
			<ion-card-header>
				<ion-card-title class="ion-text-center">Create Employee Account</ion-card-title>
				<p class="auth-subtitle ion-text-center">Use this only for library staff registration.</p>
			</ion-card-header>

			<ion-card-content>
				<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
					<ion-item>
						<ion-input
							label="Email"
							labelPlacement="floating"
							formControlName="email"
							type="email"
						></ion-input>
					</ion-item>

					<ion-item>
						<ion-input
							label="Username"
							labelPlacement="floating"
							formControlName="username"
							type="text"
						></ion-input>
					</ion-item>

					<ion-item>
						<ion-input
							label="Password"
							labelPlacement="floating"
							formControlName="password"
							type="password"
						></ion-input>
					</ion-item>

					<ion-text color="danger" [hidden]="!errorMessage()">{{ errorMessage() }}</ion-text>

					<ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="isSubmitting()"
						>Register</ion-button
					>

					<div class="auth-link ion-text-center ion-margin-top">
						<ion-button fill="clear" size="small" (click)="goToLogin()" [disabled]="isSubmitting()">
							Already have an account? Login
						</ion-button>
					</div>
				</form>
			</ion-card-content>
		</ion-card>
	</div>
</ion-content>
